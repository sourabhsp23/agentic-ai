# Continuous integration: runs on every push and pull request. Needs no AWS access.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build # tsc --strict + vite build

  docker:
    name: Docker images (build + scan)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: insightpilot-api:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: insightpilot-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Smoke test API container
        run: |
          docker run -d --name api -p 8000:8000 -e APP_ENV=dev insightpilot-api:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/readyz && break; sleep 2; done
          curl -fs -X POST localhost:8000/api/ask -H 'content-type: application/json' \
            -d '{"dataset":"ecommerce","question":"How many orders are there?"}' | grep -q '"status":"completed"'
          docker logs api | tail -20

      # Report-only for now. Lesson: switch exit-code to "1" to block releases on CRITICAL vulnerabilities.
      - name: Scan API image (Trivy)
        # Pinned to a commit SHA: tags can be moved or deleted, a SHA cannot (supply-chain safety).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: insightpilot-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
