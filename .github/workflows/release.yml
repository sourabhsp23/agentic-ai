# Continuous delivery: build images, push them to Amazon ECR, deploy to the chosen target.
#
# Stays idle (skipped, not failed) until you set these GitHub repository variables
# (Settings -> Secrets and variables -> Actions -> Variables):
#   AWS_ROLE_ARN   output "ci_role_arn" of infra/terraform/shared
#   AWS_REGION     us-east-1
#   DEPLOY_TARGET  none | ec2 | ecs | eks
#
# Authentication uses GitHub OIDC: no AWS access keys are stored in GitHub.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target (auto = DEPLOY_TARGET variable)
        type: choice
        options: [auto, none, ec2, ecs, eks]
        default: auto

permissions:
  id-token: write # request the OIDC token
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PROJECT: insightpilot

jobs:
  build-push:
    name: Build and push to ECR
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      target: ${{ steps.meta.outputs.target }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Resolve tag and target
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          TARGET="${{ github.event.inputs.target }}"
          if [ -z "$TARGET" ] || [ "$TARGET" = "auto" ]; then TARGET="${{ vars.DEPLOY_TARGET }}"; fi
          echo "target=${TARGET:-none}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-api:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-web:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy-ec2:
    name: Deploy to EC2
    needs: build-push
    if: ${{ needs.build-push.outputs.target == 'ec2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deploy.sh on the instance through SSM (no SSH)
        env:
          TAG: ${{ needs.build-push.outputs.tag }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${PROJECT}-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ "$INSTANCE_ID" = "None" ]; then echo "No running ${PROJECT}-app instance"; exit 1; fi
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $TAG" \
            --parameters "commands=['/opt/insightpilot/deploy.sh $TAG']" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" --output json
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          [ "$STATUS" = "Success" ]

  deploy-ecs:
    name: Deploy to ECS Fargate
    needs: build-push
    if: ${{ needs.build-push.outputs.target == 'ecs' }}
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$PROJECT" \
            --query taskDefinition > task-definition.json

      - id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: api
          image: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-api:${{ needs.build-push.outputs.tag }}

      - id: render-web
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-api.outputs.task-definition }}
          container-name: web
          image: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}-web:${{ needs.build-push.outputs.tag }}

      - name: Register revision and roll out (waits until healthy; circuit breaker rolls back on failure)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-web.outputs.task-definition }}
          cluster: ${{ env.PROJECT }}
          service: ${{ env.PROJECT }}
          wait-for-service-stability: true

  deploy-eks:
    name: Deploy to EKS
    needs: build-push
    if: ${{ needs.build-push.outputs.target == 'eks' }}
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Rolling update
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ needs.build-push.outputs.tag }}
        run: |
          aws eks update-kubeconfig --name "$PROJECT" --region "$AWS_REGION"
          kubectl -n "$PROJECT" set image deployment/api api="$REGISTRY/$PROJECT-api:$TAG"
          kubectl -n "$PROJECT" set image deployment/web web="$REGISTRY/$PROJECT-web:$TAG"
          kubectl -n "$PROJECT" rollout status deployment/api --timeout=5m
          kubectl -n "$PROJECT" rollout status deployment/web --timeout=5m
