apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } # zero-downtime rollouts
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: insightpilot-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: insightpilot-api
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: insightpilot-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: insightpilot-secrets
                  key: DATABASE_URL
          startupProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: api # nginx in the web pods proxies to http://api:8000
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
